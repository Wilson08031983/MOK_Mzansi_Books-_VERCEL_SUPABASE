<!DOCTYPE html>
<html>
<head>
    <title>Debug Expenses Data</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .data { background: #f5f5f5; padding: 10px; border-radius: 3px; white-space: pre-wrap; }
        button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .delete-btn { background: #dc3545; }
        .delete-btn:hover { background: #c82333; }
    </style>
</head>
<body>
    <h1>Expenses Data Debug Tool</h1>
    
    <div class="section">
        <h2>Manual Expenses (manual_expenses)</h2>
        <div id="manual-expenses" class="data"></div>
        <button onclick="clearManualExpenses()">Clear Manual Expenses</button>
    </div>
    
    <div class="section">
        <h2>Legacy Expenses (expenses)</h2>
        <div id="legacy-expenses" class="data"></div>
        <button onclick="clearLegacyExpenses()">Clear Legacy Expenses</button>
    </div>
    
    <div class="section">
        <h2>Categorized Expenses (categorizedExpenses)</h2>
        <div id="categorized-expenses" class="data"></div>
        <button onclick="clearCategorizedExpenses()">Clear Categorized Expenses</button>
    </div>
    
    <div class="section">
        <h2>Bank Statements (bankStatements)</h2>
        <div id="bank-statements" class="data"></div>
        <button onclick="clearBankStatements()">Clear Bank Statements</button>
    </div>
    
    <div class="section">
        <h2>Actions</h2>
        <button onclick="deleteEXP001()">Delete EXP001 from All Sources</button>
        <button onclick="deleteMolantwa()">Delete Molantwa Clinic Expense</button>
        <button onclick="clearAllData()" class="delete-btn">Clear All Expense Data</button>
        <button onclick="refreshData()">Refresh Data</button>
        <button onclick="testExpenseOperations()">Test Expense Operations</button>
    </div>
    
    <div class="section">
        <h2>Test Results</h2>
        <div id="test-results" class="data"></div>
    </div>
    
    <script>
        function refreshData() {
            // Manual expenses
            const manualExpenses = JSON.parse(localStorage.getItem('manual_expenses') || '[]');
            document.getElementById('manual-expenses').textContent = JSON.stringify(manualExpenses, null, 2);
            
            // Legacy expenses
            const legacyExpenses = JSON.parse(localStorage.getItem('expenses') || '[]');
            document.getElementById('legacy-expenses').textContent = JSON.stringify(legacyExpenses, null, 2);
            
            // Categorized expenses
            const categorizedExpenses = JSON.parse(localStorage.getItem('categorizedExpenses') || '[]');
            document.getElementById('categorized-expenses').textContent = JSON.stringify(categorizedExpenses, null, 2);
            
            // Bank statements
            const bankStatements = JSON.parse(localStorage.getItem('bankStatements') || '[]');
            document.getElementById('bank-statements').textContent = JSON.stringify(bankStatements, null, 2);
        }
        
        function clearManualExpenses() {
            localStorage.removeItem('manual_expenses');
            refreshData();
            alert('Manual expenses cleared');
        }
        
        function clearLegacyExpenses() {
            localStorage.removeItem('expenses');
            refreshData();
            alert('Legacy expenses cleared');
        }
        
        function clearCategorizedExpenses() {
            localStorage.removeItem('categorizedExpenses');
            refreshData();
            alert('Categorized expenses cleared');
        }
        
        function clearBankStatements() {
            localStorage.removeItem('bankStatements');
            refreshData();
            alert('Bank statements cleared');
        }
        
        function deleteEXP001() {
            let deleted = false;
            
            // Check manual expenses
            const manualExpenses = JSON.parse(localStorage.getItem('manual_expenses') || '[]');
            const filteredManual = manualExpenses.filter(e => e.id !== 'EXP001');
            if (filteredManual.length !== manualExpenses.length) {
                localStorage.setItem('manual_expenses', JSON.stringify(filteredManual));
                deleted = true;
            }
            
            // Check legacy expenses
            const legacyExpenses = JSON.parse(localStorage.getItem('expenses') || '[]');
            const filteredLegacy = legacyExpenses.filter(e => e.id !== 'EXP001');
            if (filteredLegacy.length !== legacyExpenses.length) {
                localStorage.setItem('expenses', JSON.stringify(filteredLegacy));
                deleted = true;
            }
            
            // Check categorized expenses
            const categorizedExpenses = JSON.parse(localStorage.getItem('categorizedExpenses') || '[]');
            const filteredCategorized = categorizedExpenses.filter(e => e.id !== 'EXP001');
            if (filteredCategorized.length !== categorizedExpenses.length) {
                localStorage.setItem('categorizedExpenses', JSON.stringify(filteredCategorized));
                deleted = true;
            }
            
            refreshData();
            alert(deleted ? 'EXP001 deleted from all sources' : 'EXP001 not found in any source');
        }
        
        function deleteMolantwa() {
            let deleted = false;
            
            // Check all storage locations for Molantwa Clinic expense
            const storageKeys = ['manual_expenses', 'expenses', 'categorizedExpenses'];
            
            storageKeys.forEach(key => {
                const data = JSON.parse(localStorage.getItem(key) || '[]');
                const filtered = data.filter(e => !e.description || !e.description.toLowerCase().includes('molantwa'));
                if (filtered.length !== data.length) {
                    localStorage.setItem(key, JSON.stringify(filtered));
                    deleted = true;
                }
            });
            
            refreshData();
            alert(deleted ? 'Molantwa Clinic expense deleted from all sources' : 'Molantwa Clinic expense not found');
        }
        
        function testExpenseOperations() {
            const results = [];
            
            // Test data availability
            const manualExpenses = JSON.parse(localStorage.getItem('manual_expenses') || '[]');
            const legacyExpenses = JSON.parse(localStorage.getItem('expenses') || '[]');
            const categorizedExpenses = JSON.parse(localStorage.getItem('categorizedExpenses') || '[]');
            
            results.push(`Manual Expenses: ${manualExpenses.length} items`);
            results.push(`Legacy Expenses: ${legacyExpenses.length} items`);
            results.push(`Categorized Expenses: ${categorizedExpenses.length} items`);
            
            // Check for specific expenses
            const allExpenses = [...manualExpenses, ...legacyExpenses, ...categorizedExpenses];
            const exp001 = allExpenses.find(e => e.id === 'EXP001');
            const molantwa = allExpenses.find(e => e.description && e.description.toLowerCase().includes('molantwa'));
            
            results.push(`EXP001 found: ${exp001 ? 'YES' : 'NO'}`);
            if (exp001) {
                results.push(`EXP001 details: ${JSON.stringify(exp001, null, 2)}`);
            }
            
            results.push(`Molantwa expense found: ${molantwa ? 'YES' : 'NO'}`);
            if (molantwa) {
                results.push(`Molantwa details: ${JSON.stringify(molantwa, null, 2)}`);
            }
            
            document.getElementById('test-results').textContent = results.join('\n');
        }
        
        function clearAllData() {
            if (confirm('Are you sure you want to clear ALL expense data? This cannot be undone.')) {
                localStorage.removeItem('manual_expenses');
                localStorage.removeItem('expenses');
                localStorage.removeItem('categorizedExpenses');
                localStorage.removeItem('bankStatements');
                localStorage.removeItem('expense_id_counter');
                refreshData();
                alert('All expense data cleared');
            }
        }
        
        // Load data on page load
        refreshData();
    </script>
</body>
</html>
