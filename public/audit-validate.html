<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Log Validator</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #e5e7eb; }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    .muted { color: #a3a3a3; margin-bottom: 14px; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; }
    button { background: #2563eb; color: white; border: 0; border-radius: 8px; padding: 10px 12px; cursor: pointer; font-weight: 600; }
    button:hover { opacity: .9; }
    .btn-row { display: flex; gap: 10px; margin-bottom: 14px; }
    .ok { color: #22c55e; }
    .fail { color: #ef4444; }
    pre { background: #0b1220; border: 1px solid #1f2937; border-radius: 8px; padding: 10px; overflow: auto; }
    .result { margin: 10px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Audit Log Validator</h1>
    <div class="muted">Runs quick assertions against the latest entries stored under <code>auditLog</code>. Use this after performing actions in the app or seeding samples from the quick tester.</div>

    <div class="btn-row">
      <button onclick="runAll()">Run All Checks</button>
      <button onclick="seedAndRun()">Seed Samples & Run</button>
      <button onclick="showRaw()">Show Raw (Top 20)</button>
    </div>

    <div id="output" class="card"></div>
    <div id="raw" style="margin-top: 16px;"></div>
  </div>

  <script>
    const key = 'auditLog';
    function entries(){ try{ return JSON.parse(localStorage.getItem(key)||'[]'); }catch{ return []; } }

    function assert(cond, msg){ return { pass: !!cond, msg }; }
    function latestByAction(action){ return entries().find(e => (e.action||'').toLowerCase().includes(action.toLowerCase())); }

    function checkStructure(e){
      const req = ['id','timestamp','userId','userName','category','action','page','changeType','severity','immutable'];
      return assert(req.every(k => e && Object.prototype.hasOwnProperty.call(e, k)), 'Entry has required fields');
    }

    function checkSupplierCreate(){
      const e = latestByAction('Created Supplier');
      return [
        assert(!!e, 'Created Supplier entry exists'),
        e ? assert(e.entityType==='supplier', 'entityType is supplier') : null,
        e ? assert(!!e.entityId && !!e.entityName, 'Has entity id and name') : null,
        e ? assert(e.changeType==='create', 'changeType is create') : null
      ].filter(Boolean);
    }
    function checkInventoryCreate(){
      const e = latestByAction('Created Inventory Item');
      return [
        assert(!!e, 'Created Inventory Item exists'),
        e ? assert(e.entityType==='inventoryItem','entityType is inventoryItem') : null
      ].filter(Boolean);
    }
    function checkAdjustment(){
      const e = latestByAction('Adjusted Stock') || latestByAction('Received Stock');
      return [
        assert(!!e, 'Stock adjustment/receive entry exists'),
        e ? assert(e.changeType==='update','changeType is update') : null,
        e ? assert(e.oldValues && typeof e.oldValues.stockLevel === 'number', 'oldValues.stockLevel present') : null,
        e ? assert(e.newValues && typeof e.newValues.stockLevel === 'number', 'newValues.stockLevel present') : null
      ].filter(Boolean);
    }
    function checkDamageOrExpire(){
      const e = latestByAction('Marked Item as Damaged') || latestByAction('Marked Item as Expired');
      return [
        assert(!!e, 'Damage/Expire entry exists'),
        e ? assert(e.metadata && typeof e.metadata.quantity === 'number', 'metadata.quantity present') : null,
        e ? assert(!!e.description, 'description present') : null
      ].filter(Boolean);
    }

    function runAll(){
      const groups = [
        { name: 'Structure (latest)', tests: [ checkStructure(entries()[0]||{}) ] },
        { name: 'Supplier Create', tests: checkSupplierCreate() },
        { name: 'Inventory Create', tests: checkInventoryCreate() },
        { name: 'Stock Adjustment/Receive', tests: checkAdjustment() },
        { name: 'Damage or Expire', tests: checkDamageOrExpire() }
      ];

      const out = document.getElementById('output');
      out.innerHTML = groups.map(g => {
        const items = g.tests.map(t => `<div class="result">${t.pass ? '✅ <span class=ok>PASS</span>' : '❌ <span class=fail>FAIL</span>'} - ${t.msg}</div>`).join('');
        const passed = g.tests.filter(t=>t.pass).length;
        return `<div class="card" style="margin-bottom:10px;"><strong>${g.name}</strong>${items}<div class="muted">${passed}/${g.tests.length} passed</div></div>`;
      }).join('');
    }

    function seedAndRun(){
      // open tester in new tab to seed using its function if available
      // fallback: locally add a few synthetic entries similar to tester
      try {
        window.open('/audit-quick-test.html', '_blank');
      } catch {}

      // simple local seed: create/update/delete supplier
      const e = entries();
      const mk = (action, entityType) => ({
        id: crypto.randomUUID(), timestamp: new Date().toISOString(), userId: 'tester', userName: 'Tester', userRole: 'Admin',
        category: 'crud', action, page: 'Inventory', changeType: action.includes('Created')?'create':action.includes('Deleted')?'delete':'update',
        entityType, entityId: `${entityType}-X1`, entityName: `${entityType}-Name`, description: `${action} ${entityType}`,
        severity: 'medium', immutable: true, metadata: { timestamp: Date.now() }
      });
      e.unshift(mk('Created Supplier','supplier'));
      e.unshift(mk('Created Inventory Item','inventoryItem'));
      localStorage.setItem(key, JSON.stringify(e.slice(0,2000)));
      runAll();
    }

    function showRaw(){
      const raw = document.getElementById('raw');
      const e = entries().slice(0,20);
      raw.innerHTML = `<div class="card"><strong>Raw (Top 20)</strong><pre>${JSON.stringify(e,null,2)}</pre></div>`;
    }

    runAll();
  </script>
</body>
</html>
