<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug VAT Calculation Flow</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .button {
            background: #007cba;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .button:hover {
            background: #005a87;
        }
        .log {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 500px;
            overflow-y: auto;
            margin: 10px 0;
        }
        .section {
            border: 1px solid #ddd;
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
        .warning {
            color: orange;
        }
    </style>
</head>
<body>
    <h1>Debug VAT Calculation Flow</h1>
    
    <div>
        <button class="button" onclick="runFullDebug()">Run Full Debug</button>
        <button class="button" onclick="testPeriodParsing()">Test Period Parsing</button>
        <button class="button" onclick="testInvoiceFiltering()">Test Invoice Filtering</button>
        <button class="button" onclick="testVATCalculation()">Test VAT Calculation</button>
        <button class="button" onclick="clearLog()">Clear Log</button>
    </div>
    
    <div class="section">
        <h2>Debug Log</h2>
        <div id="log" class="log"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logElement = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
            logElement.innerHTML += `<span class="${className}">[${timestamp}] ${prefix} ${message}</span>\n`;
            logElement.scrollTop = logElement.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // Copy the parsePeriod function from the service
        function parsePeriod(period) {
            const currentYear = new Date().getFullYear();
            
            // Handle "Month YYYY" format (e.g., "June 2025")
            const monthYearMatch = period.match(/^(\w+)\s+(\d{4})$/);
            if (monthYearMatch) {
                const [, monthName, year] = monthYearMatch;
                const monthIndex = new Date(`${monthName} 1, ${year}`).getMonth();
                const startDate = new Date(parseInt(year), monthIndex, 1);
                const endDate = new Date(parseInt(year), monthIndex + 1, 0); // Last day of month
                
                return {
                    startDate: startDate.toISOString().split('T')[0],
                    endDate: endDate.toISOString().split('T')[0]
                };
            }
            
            // Handle "QX YYYY" format (e.g., "Q2 2025")
            const quarterMatch = period.match(/^Q([1-4])\s+(\d{4})$/);
            if (quarterMatch) {
                const [, quarter, year] = quarterMatch;
                const quarterNum = parseInt(quarter);
                const startMonth = (quarterNum - 1) * 3;
                const endMonth = startMonth + 2;
                
                const startDate = new Date(parseInt(year), startMonth, 1);
                const endDate = new Date(parseInt(year), endMonth + 1, 0); // Last day of quarter
                
                return {
                    startDate: startDate.toISOString().split('T')[0],
                    endDate: endDate.toISOString().split('T')[0]
                };
            }
            
            // Handle "YYYY-MM" format
            const yearMonthMatch = period.match(/^(\d{4})-(\d{2})$/);
            if (yearMonthMatch) {
                const [, year, month] = yearMonthMatch;
                const startDate = new Date(parseInt(year), parseInt(month) - 1, 1);
                const endDate = new Date(parseInt(year), parseInt(month), 0); // Last day of month
                
                return {
                    startDate: startDate.toISOString().split('T')[0],
                    endDate: endDate.toISOString().split('T')[0]
                };
            }
            
            // Default to current month if parsing fails
            const now = new Date();
            const startDate = new Date(now.getFullYear(), now.getMonth(), 1);
            const endDate = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            
            return {
                startDate: startDate.toISOString().split('T')[0],
                endDate: endDate.toISOString().split('T')[0]
            };
        }

        function testPeriodParsing() {
            log('=== TESTING PERIOD PARSING ===');
            
            const testPeriods = ['Q2 2025', 'Q1 2025', 'June 2025', '2025-06'];
            
            testPeriods.forEach(period => {
                try {
                    const result = parsePeriod(period);
                    log(`Period "${period}" parsed to: ${result.startDate} to ${result.endDate}`, 'success');
                } catch (error) {
                    log(`Error parsing period "${period}": ${error.message}`, 'error');
                }
            });
        }

        function testInvoiceFiltering() {
            log('=== TESTING INVOICE FILTERING ===');
            
            const invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
            log(`Total invoices in localStorage: ${invoices.length}`);
            
            if (invoices.length === 0) {
                log('No invoices found. Please create test invoices first.', 'warning');
                return;
            }
            
            // Test with Q2 2025
            const period = 'Q2 2025';
            const { startDate, endDate } = parsePeriod(period);
            const start = new Date(startDate);
            const end = new Date(endDate);
            
            log(`Testing filtering for period: ${period}`);
            log(`Date range: ${startDate} to ${endDate}`);
            log(`Start date object: ${start.toISOString()}`);
            log(`End date object: ${end.toISOString()}`);
            
            const validInvoices = invoices.filter(invoice => {
                const invoiceDate = new Date(invoice.date || invoice.invoiceDate);
                const isValidStatus = invoice.status !== 'draft' && invoice.status !== 'cancelled';
                const isInDateRange = invoiceDate >= start && invoiceDate <= end;
                
                log(`Invoice ${invoice.id || invoice.number}:`);
                log(`  - Date: ${invoice.date || invoice.invoiceDate} (parsed: ${invoiceDate.toISOString()})`);
                log(`  - Status: ${invoice.status} (valid: ${isValidStatus})`);
                log(`  - In range: ${isInDateRange}`);
                log(`  - VAT Total: ${invoice.vatTotal}`);
                log(`  - Include: ${isValidStatus && isInDateRange}`);
                
                return isValidStatus && isInDateRange;
            });
            
            log(`\nFiltered invoices: ${validInvoices.length}`, validInvoices.length > 0 ? 'success' : 'warning');
            
            if (validInvoices.length > 0) {
                const totalVAT = validInvoices.reduce((sum, inv) => sum + (parseFloat(inv.vatTotal) || 0), 0);
                log(`Total VAT from filtered invoices: R${totalVAT.toFixed(2)}`, 'success');
            }
        }

        function testVATCalculation() {
            log('=== TESTING VAT CALCULATION ===');
            
            const period = 'Q2 2025';
            const { startDate, endDate } = parsePeriod(period);
            
            log(`Calculating VAT for period: ${startDate} to ${endDate}`);
            
            // Clear caches
            localStorage.removeItem('vatCalculations');
            localStorage.removeItem('cachedVAT');
            localStorage.removeItem('vatCache');
            localStorage.removeItem('calculationCache');
            log('Cleared VAT calculation caches');
            
            // Get invoices
            const allInvoices = JSON.parse(localStorage.getItem('invoices') || '[]');
            log(`Total invoices: ${allInvoices.length}`);
            
            if (allInvoices.length === 0) {
                log('No invoices found for calculation', 'error');
                return;
            }
            
            // Filter invoices
            const start = new Date(startDate);
            const end = new Date(endDate);
            
            const validInvoices = allInvoices.filter(invoice => {
                const invoiceDate = new Date(invoice.date || invoice.invoiceDate);
                const isValidStatus = invoice.status !== 'draft' && invoice.status !== 'cancelled';
                const isInDateRange = invoiceDate >= start && invoiceDate <= end;
                return isValidStatus && isInDateRange;
            });
            
            log(`Valid invoices for calculation: ${validInvoices.length}`);
            
            // Calculate VAT
            let outputVATTotal = 0;
            
            validInvoices.forEach(invoice => {
                let vatAmount = 0;
                
                if (invoice.vatTotal !== undefined && invoice.vatTotal !== null) {
                    vatAmount = parseFloat(invoice.vatTotal) || 0;
                    log(`Using vatTotal for ${invoice.id || invoice.number}: R${vatAmount}`);
                } else if (invoice.subtotal !== undefined && invoice.vatRate !== undefined) {
                    const subtotal = parseFloat(invoice.subtotal) || 0;
                    const vatRate = parseFloat(invoice.vatRate) || 0;
                    vatAmount = subtotal * (vatRate / 100);
                    log(`Calculated from subtotal for ${invoice.id || invoice.number}: ${subtotal} * ${vatRate}% = R${vatAmount}`);
                }
                
                vatAmount = isNaN(vatAmount) ? 0 : vatAmount;
                outputVATTotal += vatAmount;
                log(`Added R${vatAmount}, running total: R${outputVATTotal}`);
            });
            
            log(`\nFinal Output VAT Total: R${outputVATTotal.toFixed(2)}`, outputVATTotal > 0 ? 'success' : 'warning');
            
            // Create result object
            const result = {
                period: `${startDate} to ${endDate}`,
                startDate,
                endDate,
                outputVAT: {
                    standardRated: outputVATTotal,
                    zeroRated: 0,
                    exempt: 0,
                    exports: 0,
                    total: outputVATTotal
                },
                inputVAT: {
                    standardRated: 120.30, // From the UI screenshot
                    capitalGoods: 0,
                    importVAT: 0,
                    total: 120.30
                },
                netVAT: outputVATTotal - 120.30
            };
            
            log(`\nCalculation Result:`);
            log(JSON.stringify(result, null, 2));
        }

        function runFullDebug() {
            clearLog();
            log('=== STARTING FULL VAT CALCULATION DEBUG ===');
            
            testPeriodParsing();
            log('\n');
            testInvoiceFiltering();
            log('\n');
            testVATCalculation();
            
            log('\n=== DEBUG COMPLETE ===');
        }

        // Auto-run on page load
        window.addEventListener('load', () => {
            log('Debug page loaded. Click "Run Full Debug" to start testing.');
        });
    </script>
</body>
</html>
