<!DOCTYPE html>
<html>
<head>
    <title>LocalStorage Debug</title>
</head>
<body>
    <h1>LocalStorage Debug Tool</h1>
    <button onclick="checkLocalStorage()">Check LocalStorage</button>
    <button onclick="clearLocalStorage()">Clear LocalStorage</button>
    <div id="output"></div>

    <script>
        function checkLocalStorage() {
            const output = document.getElementById('output');
            let html = '<h2>LocalStorage Contents:</h2>';
            
            // Check bank statements
            const bankStatements = localStorage.getItem('bankStatements');
            html += '<h3>Bank Statements:</h3>';
            if (bankStatements) {
                const statements = JSON.parse(bankStatements);
                html += `<p>Count: ${statements.length}</p>`;
                html += `<pre>${JSON.stringify(statements, null, 2)}</pre>`;
            } else {
                html += '<p>No bank statements found</p>';
            }
            
            // Check categorized expenses
            const expenses = localStorage.getItem('categorizedExpenses');
            html += '<h3>Categorized Expenses:</h3>';
            if (expenses) {
                const expenseList = JSON.parse(expenses);
                html += `<p>Count: ${expenseList.length}</p>`;
                html += `<pre>${JSON.stringify(expenseList, null, 2)}</pre>`;
            } else {
                html += '<p>No categorized expenses found</p>';
            }
            
            // Check expense slips
            const slips = localStorage.getItem('expenseSlips');
            html += '<h3>Expense Slips:</h3>';
            if (slips) {
                const slipList = JSON.parse(slips);
                html += `<p>Count: ${slipList.length}</p>`;
                html += `<pre>${JSON.stringify(slipList, null, 2)}</pre>`;
            } else {
                html += '<p>No expense slips found</p>';
            }
            
            output.innerHTML = html;
        }
        
        function clearLocalStorage() {
            localStorage.removeItem('bankStatements');
            localStorage.removeItem('categorizedExpenses');
            localStorage.removeItem('expenseSlips');
            alert('LocalStorage cleared!');
            checkLocalStorage();
        }
        
        // Auto-check on load
        window.onload = checkLocalStorage;
    </script>
</body>
</html>
